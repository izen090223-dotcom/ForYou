<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>For You</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =====================================
         MAIN EXPERIENCE
    ====================================== -->

    <main id="experience">


        <!-- =================================
             STORY
        ================================== -->

        <section id="storyScreen" class="screen active">

            <div id="storyContent" class="content">

                <h1 id="title">For you.</h1>

                <p id="message">
                    Whenever you're ready.
                </p>


                <div id="buttons">

                    <button id="backButton">
                        Back
                    </button>

                    <button id="nextButton">
                        Begin
                    </button>

                </div>

            </div>

        </section>



        <!-- =================================
             MUSIC
        ================================== -->

        <section id="musicScreen" class="screen">

            <div class="musicContent">

                <h2>
                    Before you continue...
                </h2>

                <p>
                    I picked something for you.
                </p>


                <!-- Spotify -->

                <div id="spotifyPlayer">

                    <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/playlist/5pFDMFxpp2tMyR24SjVq2W?utm_source=generator&si=1aa79fe1928246e3" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>

                </div>


                <p class="musicNote">
                    You can listen while you read,
                    if you'd like.
                </p>


                <div class="musicButtons">

                    <button id="musicBackButton">
                        Back
                    </button>

                    <button id="letterButton">
                        Read my letter
                    </button>

                </div>

            </div>

        </section>



        <!-- =================================
             LETTER
        ================================== -->

        <section id="letterScreen">

            <div id="letterPage">

                <div id="letterContent">

                    <p id="letterText"></p>

                </div>


                <div id="letterControls">

                    <button id="letterBack">
                        Back
                    </button>

                    <div id="gateMessage"></div>

                    <button id="letterNext">
                        Continue
                    </button>

                </div>

            </div>

        </section>



    </main>


    <script src="script.js"></script>

</body>

</html>
